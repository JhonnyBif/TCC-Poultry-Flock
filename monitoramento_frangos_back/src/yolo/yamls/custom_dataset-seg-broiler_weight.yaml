# Example usage: yolo train data=custom_dataset.yaml
# parent
# ├── ultralytics
# └── data
#     └── WindTurbines


# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: Yolo-back/data/peso  # dataset root dir
train: train  # train images (relative to 'path')
val: valid  # val images (relative to 'path')
test: test  # test images (relative to 'path')

# Classes
nc: 11
names: ['385-gm', '385gm', '390gm', '393gm', '425gm', '430gm', '432gm', '435gm', '440gm', '460gm', '477gm']
